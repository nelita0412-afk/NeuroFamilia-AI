services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: neurofamilia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurofamilia
      POSTGRES_PASSWORD: neurofamilia
      POSTGRES_DB: neurofamilia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neurofamilia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: